  """
  Supplied balance with interest; null only when the row is empty on both sides.
  """
  supplied: Erc20AmountVariation

  """
  Supply interest earned across the row. Null on the same terms as `supplied`.
  """
  earnings: Erc20AmountVariation

  """Supply rewards the plan gains or gives up on the row's own reserves."""
  rewards: PreviewRewardOutcome!

  """
  The hub asset's base rates, one pair since all its reserves share one curve.
  """
  reserveRates: ScopedReserveRates

  """The row's supplies in USD, before and after the plan."""
  totalSupplied(currency: Currency! = USD): ExchangeAmountVariation!

  """
  Yearly earnings at the row's APY, not the accrued interest `earnings` reports.
  """
  projectedEarnings(currency: Currency! = USD): ExchangeAmountVariation!

  """
  Base rate, underlying yield and the Merkl APY each side is eligible for, weighted by value.
