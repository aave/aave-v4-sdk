"""
Open or increase a leveraged position: flash-loan the debt asset, swap it to the collateral asset,
supply the collateral, then borrow the debt to repay the flash loan. The equity base is the user's
collateral-enabled balance in `collateralReserve` plus the optional wallet top-up, and
`multiplier` is the target exposure (> 1) applied to that equity.

Not previewable directly: `previewUserPosition` needs the executed swap amounts, so quote first
and preview the resulting `quoteId` via `fromQuote`.
"""
input MarketLeverageQuoteInput {
  """
  Quote accuracy level - FAST for faster response, ACCURATE for verified pricing (default)
  """
  accuracy: QuoteAccuracy! = ACCURATE

  """
  Debt reserve that is flash-loaned and borrowed to repay the flash loan.
  """
  debtReserve: ReserveId!

  """Collateral reserve bought and supplied."""
  collateralReserve: ReserveId!

  """
  Target exposure multiplier (target collateral / entry equity), must be greater than 1.
  Must stay under `maxSafeMultiplier`, the multiplier at which this position becomes
  liquidatable. Omit it to be quoted at a health factor chosen from how closely the two legs
  track each other, which still takes a single quote. The resolved value is implied by the
  quote's own amounts: `multiplier = 1 + buyAmount / equity`.
  """
  multiplier: BigDecimal

  """
  Optional extra collateral pulled from the wallet (via EIP-2612) on top of the user's existing
  collateral, in the collateral asset's human units. Required when opening a fresh position.
  """
  additionalCollateral: BigDecimal

  """
  Whether to enable the supplied collateral as collateral on the spoke (defaults to true).
  """
  enableCollateral: Boolean
  user: EvmAddress!
  selectedSlippage: BigDecimal
}

