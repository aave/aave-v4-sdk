schema {
  query: V4Query
  mutation: V4Mutation
  subscription: V4Subscription
}

input ActivitiesRequest {
  query: ActivitiesRequestQuery!
  user: EvmAddress
  types: [ActivityType!]! = [BORROW, SUPPLY, WITHDRAW, REPAY, LIQUIDATED, SET_AS_COLLATERAL, UPDATED_DYNAMIC_CONFIG, UPDATED_RISK_PREMIUM, TOKEN_TO_TOKEN_SWAP, SUPPLY_SWAP, BORROW_SWAP, REPAY_WITH_SUPPLY, WITHDRAW_SWAP, LEVERAGE]
  pageSize: PageSize! = FIFTY
  cursor: Cursor
}

input ActivitiesRequestQuery @oneOf {
  hub: HubInput
  hubId: HubId
  spoke: SpokeInput
  spokeId: SpokeId
  chainIds: [ChainId!]
  txHash: TxHashInput
  userPositionId: UserPositionId
}

union ActivityItem = BorrowActivity | SupplyActivity | WithdrawActivity | RepayActivity | LiquidatedActivity | UsingAsCollateralActivity | UpdatedDynamicConfigActivity | UpdatedRiskPremiumActivity | TokenSwapActivity | SupplySwapActivity | BorrowSwapActivity | RepayWithSupplyActivity | WithdrawSwapActivity | LeverageActivity

enum ActivityType {
  SUPPLY
  BORROW
  REPAY
  WITHDRAW
  LIQUIDATED
  SET_AS_COLLATERAL
  UPDATED_DYNAMIC_CONFIG
