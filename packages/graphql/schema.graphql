  swap(request: SwapRequest!): SwapExecutionPlan! @deprecated(reason: "Use submitOrder.")
  cancelSwap(request: CancelSwapRequest!): CancelSwapExecutionPlan! @deprecated(reason: "Use cancelOrder.")
  submitOrder(request: SubmitOrderRequest!): OrderExecutionPlan!
  cancelOrder(request: CancelOrderRequest!): CancelOrderExecutionPlan!
}

type V4Query {
  """
