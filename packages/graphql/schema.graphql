"""A single point on the interest rate model curve."""
type HubAssetInterestRateModelPoint {
  """The utilization rate at this point on the curve"""
  utilizationRate: PercentNumber!

  """
  The borrow rate at this utilization level, compounded so the curve meets `borrowApy`
  """
  borrowRate: PercentNumber!

  """
  Nominal borrow rate × utilization × (1 − fee) at this utilization level, then compounded
  """
  supplyRate: PercentNumber!

  """
  The absolute liquidity distance from the current state to reach this utilization level.
  Always a positive value representing the token amount that needs to move.
  At the asset's current utilization, this value is zero.
  """
  liquidityDistance: Erc20Amount!
}

"""
Request to compute the full interest rate model for a hub asset: every 0.5% step from 0% to 100% utilization,
plus the current utilization and the curve's kink, showing how supply/borrow rates and required liquidity changes vary across
the entire utilization range.
"""
input HubAssetInterestRateModelRequest {
  query: HubAssetInterestRateModelRequestQuery!
}

"""Identifies the hub asset to compute the interest rate model for."""
input HubAssetInterestRateModelRequestQuery @oneOf {
  """The hub asset id"""
  hubAssetId: HubAssetId
}

type HubAssetInterestRateModelResult {
  points: [HubAssetInterestRateModelPoint!]!
}

